<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>候选人分析（脱敏版）</title>
<style>
:root{
  --bg:#F7F7F5; --card:#FFFFFF; --line:#E4E3DD; --line-strong:#CFCEC6;
  --ink:#1F1F1D; --ink2:#5A5A55; --ink3:#8A8A83;
  --green:#0F6E56; --green-bg:#E4F5EF; --green-line:#9FDCC7;
  --amber:#8A5309; --amber-bg:#FBF0DC; --amber-line:#F0CE8E;
  --red:#9E2B2B; --red-bg:#FBEAEA; --red-line:#F2BFBF;
  --blue:#185FA5; --blue-bg:#EAF2FB; --blue-line:#B5D4F4;
  --radius:12px; --radius-s:8px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

.app{display:flex;flex-direction:column;height:100vh;overflow:hidden}

/* ---------- 抬头 ---------- */
.topbar{
  display:flex;align-items:center;gap:14px;padding:15px 24px;
  background:var(--card);border-bottom:1px solid var(--line);flex-shrink:0;
}
.brand{font-size:16px;font-weight:600;letter-spacing:.2px}
.brand .sub{font-weight:400;color:var(--ink3);font-size:12.5px;margin-left:9px}
.topbar-spacer{flex:1}
.topbar-tools{display:flex;gap:8px;align-items:center}
.topbar-tools .btn{flex-shrink:0}
.hint{font-size:12px;color:var(--ink3)}

/* ---------- 三栏 ---------- */
.main{display:flex;flex:1;overflow:hidden}

/* 左：岗位列表 */
.rail{
  width:240px;flex-shrink:0;background:var(--card);border-right:1px solid var(--line);
  overflow-y:auto;padding:16px 12px;
}
.rail-h{
  font-size:11.5px;font-weight:600;color:var(--ink3);letter-spacing:.4px;
  padding:0 10px 10px;
}
.pos{
  display:block;width:100%;text-align:left;padding:11px 12px;border-radius:var(--radius-s);
  margin-bottom:5px;transition:background .15s;border:1px solid transparent;
}
.pos:hover{background:var(--bg)}
.pos.on{background:var(--blue-bg);border-color:var(--blue-line)}
.pos-top{display:flex;align-items:center;gap:7px;margin-bottom:3px}
.pos-name{font-size:13.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos.on .pos-name{color:var(--blue)}
.pos-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pos-dot.active{background:var(--green)}
.pos-dot.pending{background:var(--line-strong)}
.pos-sub{font-size:11.5px;color:var(--ink3);line-height:1.5}
.pos-badge{
  display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:10px;
  background:var(--bg);color:var(--ink3);border:1px solid var(--line);margin-top:5px;
}
.pos.on .pos-badge{background:rgba(255,255,255,.7);border-color:var(--blue-line);color:var(--blue)}

/* 中：候选人列表 */
.list{flex:1;overflow-y:auto;padding:20px 24px;min-width:0}
.list-h{display:flex;align-items:flex-end;gap:14px;margin-bottom:6px;flex-wrap:wrap}
.list-title{font-size:18px;font-weight:600}
.list-sub{font-size:12.5px;color:var(--ink3)}
.list-desc{font-size:12.5px;color:var(--ink3);margin-bottom:16px;line-height:1.6}
.list-bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.legend{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:5px}
.ldot{width:8px;height:8px;border-radius:50%}
.ldot.g{background:var(--green)}.ldot.a{background:var(--amber)}.ldot.r{background:var(--red)}.ldot.n{background:var(--line-strong);border:1px solid var(--line-strong)}

.rows{display:flex;flex-direction:column;gap:10px}
.row{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 16px;transition:border-color .15s,box-shadow .15s;
}
.row:hover{border-color:var(--line-strong);box-shadow:0 2px 10px rgba(0,0,0,.05)}
.row.on{border-color:var(--blue);box-shadow:0 2px 12px rgba(24,95,165,.1)}
.row-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.avatar{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600}
.avatar.green{background:var(--green-bg);color:var(--green)}
.avatar.amber{background:var(--amber-bg);color:var(--amber)}
.avatar.red{background:var(--red-bg);color:var(--red)}
.row-id{flex:1;min-width:150px}
.row-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row-meta{font-size:12px;color:var(--ink3);margin-top:2px}
.tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:500;border:1px solid}
.tag.green{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.tag.amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.tag.red{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.tag.blue{background:var(--blue-bg);color:var(--blue);border-color:var(--blue-line)}
.tag.gray{background:var(--bg);color:var(--ink3);border-color:var(--line)}

.scores{display:flex;gap:16px;flex-shrink:0}
.sc{text-align:right;min-width:60px}
.sc .lbl{font-size:10.5px;color:var(--ink3);white-space:nowrap}
.sc .val{font-size:16px;font-weight:600;letter-spacing:-.3px}
.sc .val.green{color:var(--green)}.sc .val.amber{color:var(--amber)}.sc .val.red{color:var(--red)}

.row-mid{display:flex;align-items:center;gap:10px;margin-top:11px;flex-wrap:wrap}
.mini{display:flex;gap:6px;align-items:center}
.mini-c{width:30px;height:26px;border-radius:5px;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line)}
.mini-c .k{font-size:9.5px;color:var(--ink3);line-height:1}
.mini-c .v{font-size:11.5px;font-weight:600;line-height:1.15}
.mini-c .v.green{color:var(--green)}.mini-c .v.amber{color:var(--amber)}.mini-c .v.red{color:var(--red)}

.row-why{font-size:12px;color:var(--ink2);flex:1;min-width:180px}
.row-why b{font-weight:600;color:var(--ink)}
.row-act{display:flex;gap:7px;align-items:center;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line);flex-wrap:wrap}
.row-act .lb{font-size:11.5px;color:var(--ink3);margin-right:2px}

.dbtn{
  padding:5px 13px;border-radius:7px;font-size:12.5px;border:1px solid var(--line-strong);
  background:var(--card);color:var(--ink2);transition:all .15s;
}
.dbtn:hover{border-color:var(--ink3);color:var(--ink)}
.dbtn.sel{font-weight:500}
.dbtn.sel.green{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}
.dbtn.sel.amber{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.dbtn.sel.red{background:var(--red-bg);border-color:var(--red-line);color:var(--red)}
.viewbtn{
  margin-left:auto;padding:5px 13px;border-radius:7px;font-size:12.5px;font-weight:500;
  background:var(--blue-bg);border:1px solid var(--blue-line);color:var(--blue);transition:all .15s;
}
.viewbtn:hover{background:#DCEAF9}
.status-note{font-size:11.5px;color:var(--ink3);margin-left:4px}
.status-note.green{color:var(--green);font-weight:500}
.status-note.amber{color:var(--amber);font-weight:500}
.status-note.red{color:var(--red);font-weight:500}

.resetbtn{
  font-size:11.5px;color:var(--ink3);text-decoration:underline;
  text-underline-offset:2px;
}
.resetbtn:hover{color:var(--ink)}

/* 待更新空态 */
.pendingBox{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:32px;text-align:center;max-width:620px;margin:24px auto;
}
.pendingBox .pi{
  width:48px;height:48px;border-radius:50%;background:var(--bg);border:1px solid var(--line);
  margin:0 auto 16px;display:flex;align-items:center;justify-content:center;color:var(--ink3);
}
.pendingBox h3{font-size:16px;font-weight:600;margin-bottom:7px}
.pendingBox p{font-size:13px;color:var(--ink2);margin-bottom:18px}
.todoList{text-align:left;background:var(--bg);border-radius:var(--radius-s);padding:15px 18px;margin-bottom:16px}
.todoList .tl{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:9px}
.todoList li{font-size:12.5px;color:var(--ink2);list-style:none;padding-left:16px;position:relative;margin-bottom:7px;line-height:1.55}
.todoList li:last-child{margin-bottom:0}
.todoList li:before{content:"○";position:absolute;left:0;color:var(--line-strong);font-size:11px}

.fwgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;text-align:left}
.fwgrid .fw{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.fwgrid .fw .fk{color:var(--ink3);flex-shrink:0}
.fwgrid .fw .fv{color:var(--ink2);text-align:right}

/* 岗位详情抽屉按钮区 */
.jdbar{display:flex;gap:9px;margin-bottom:16px;flex-wrap:wrap}

/* ---------- 右：详情面板 ---------- */
.panel{
  width:0;flex-shrink:0;background:var(--card);border-left:1px solid var(--line);
  overflow:hidden;transition:width .28s cubic-bezier(.3,.7,.3,1);display:flex;flex-direction:column;
}
.panel.open{width:min(50%,680px)}
.panel-head{padding:15px 20px;border-bottom:1px solid var(--line);flex-shrink:0;display:flex;align-items:center;gap:13px}
.panel-head .ph-txt{flex:1;min-width:0}
.panel-head h2{font-size:15.5px;font-weight:600}
.panel-head .ph-meta{font-size:12px;color:var(--ink3);margin-top:2px}
.iconbtn{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:var(--ink3);flex-shrink:0;transition:background .15s}
.iconbtn:hover{background:var(--bg);color:var(--ink)}
.panel-body{flex:1;overflow-y:auto;padding:18px 20px 40px}

.sec{margin-bottom:22px}
.sec:last-child{margin-bottom:0}
.sec h3{font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:10px;padding-bottom:7px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.sec h3 .badge{font-size:10.5px;font-weight:500;padding:1px 7px;border-radius:4px;background:var(--bg);color:var(--ink3);border:1px solid var(--line)}
.sec p{font-size:12.5px;color:var(--ink2);line-height:1.7}

.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
.kv dt{color:var(--ink3);white-space:nowrap}
.kv dd{color:var(--ink)}

.item{padding:10px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:none;padding-bottom:0}
.item .it{font-size:12.5px;font-weight:600;margin-bottom:3px;display:flex;gap:8px;align-items:baseline}
.item .id{font-size:12px;color:var(--ink2);line-height:1.65}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:7px}
.dot.g{background:var(--green)}.dot.a{background:var(--amber)}.dot.r{background:var(--red)}

.callout{padding:11px 13px;border-radius:var(--radius-s);font-size:12px;line-height:1.65;border:1px solid}
.callout.blue{background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue)}
.callout.amber{background:var(--amber-bg);border-color:var(--amber-line);color:var(--amber)}
.callout.green{background:var(--green-bg);border-color:var(--green-line);color:var(--green)}

.resume-raw{
  background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-s);
  padding:15px 17px;font-size:12px;line-height:1.8;color:var(--ink2);
  white-space:pre-wrap;word-break:break-word;
  font-family:"SF Mono",Consolas,"Courier New",monospace;
}

.drop{border:1.5px dashed var(--line-strong);border-radius:var(--radius);padding:30px 18px;text-align:center;background:var(--bg);transition:border-color .15s,background .15s;cursor:pointer}
.drop.over{border-color:var(--blue);background:var(--blue-bg)}
.drop .dt{font-size:13px;font-weight:500;margin-bottom:5px}
.drop .dd{font-size:11.5px;color:var(--ink3);line-height:1.6}
.drop-img{margin-top:13px;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;background:var(--card)}
.drop-img img{width:100%;display:block}
.drop-tools{display:flex;gap:8px;margin-top:11px;justify-content:center;flex-wrap:wrap}
.btn{padding:6px 14px;border-radius:7px;font-size:12px;background:var(--card);border:1px solid var(--line-strong);color:var(--ink2);transition:background .15s,border-color .15s}
.btn:hover{background:var(--bg);border-color:var(--ink3);color:var(--ink)}

/* JD 详情面板内 */
.jdsec{margin-bottom:18px}
.jdsec h4{font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.req{display:flex;gap:9px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12.5px}
.req:last-child{border-bottom:none;padding-bottom:0}
.req .rt{flex-shrink:0;font-size:10.5px;font-weight:500;padding:2px 7px;border-radius:4px;height:fit-content;margin-top:1px}
.req .rt.hot{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}
.req .rt.norm{background:var(--bg);color:var(--ink3);border:1px solid var(--line)}
.req .rx{flex:1;color:var(--ink2);line-height:1.6}
.simple-list{font-size:12.5px;color:var(--ink2);line-height:1.7}
.simple-list li{margin-bottom:6px;list-style:none;padding-left:14px;position:relative}
.simple-list li:before{content:"";position:absolute;left:2px;top:9px;width:4px;height:4px;border-radius:50%;background:var(--line-strong)}
.metaphor{background:var(--blue-bg);border:1px solid var(--blue-line);border-radius:var(--radius-s);padding:13px 15px;font-size:12.5px;color:var(--blue);line-height:1.7}
.metaphor .mn{font-size:11.5px;color:#378ADD;margin-top:7px;padding-top:7px;border-top:1px dashed var(--blue-line)}
.proles{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:13px}
.prole{background:var(--bg);border-radius:var(--radius-s);padding:11px 13px;border:1px solid var(--line)}
.prole .pn{font-size:12.5px;font-weight:600;margin-bottom:3px}
.prole .pd{font-size:11.5px;color:var(--ink2);line-height:1.6}

/* 决策情况视图 */
.rail-gap{padding-top:14px}
.dsec{margin-bottom:16px}
.dsec-h{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;margin-bottom:8px}
.dcount{font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:10px;background:var(--bg);border:1px solid var(--line);color:var(--ink3)}
.dcount.green{background:var(--green-bg);color:var(--green);border-color:var(--green-line)}
.dcount.amber{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-line)}
.dcount.red{background:var(--red-bg);color:var(--red);border-color:var(--red-line)}
.dgroups{display:flex;flex-direction:column;gap:14px}
.drow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);padding:11px 14px;flex-wrap:wrap}
.drow-main{flex:1;min-width:170px}
.dname{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dmeta{font-size:11.5px;color:var(--ink3);margin-top:2px}
.dtime{font-size:11.5px;color:var(--ink3);white-space:nowrap}
.dempty{font-size:12px;color:var(--ink3);background:var(--card);border:1px dashed var(--line);border-radius:var(--radius-s);padding:12px 14px}
.logbox{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-s);padding:4px 14px}
.logline{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px;flex-wrap:wrap}
.logline:last-child{border-bottom:none}
.logline .lt{color:var(--ink3);font-size:11px;white-space:nowrap;min-width:92px}
.logline .ln{font-weight:600}
.logline .lo{color:var(--ink2)}
.logline .lo.g{color:var(--green);font-weight:500}
.logline .lo.a{color:var(--amber);font-weight:500}
.logline .lo.r{color:var(--red);font-weight:500}
.logline .lp{color:var(--ink3);font-size:11px;margin-left:auto;text-align:right}

/* 推送简历至邮箱 */
.mailbox{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.mailbox .mlb{font-size:12px;color:var(--ink3);white-space:nowrap}
.minput{
  flex:1;min-width:0;padding:7px 11px;border:1px solid var(--line-strong);border-radius:7px;
  font-size:12.5px;font-family:inherit;color:var(--ink);background:var(--card);transition:border-color .15s;
}
.minput:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(24,95,165,.1)}
.mailbtns{display:flex;gap:8px;flex-wrap:wrap}
.btn.primary{
  background:var(--blue-bg);border-color:var(--blue-line);color:var(--blue);font-weight:500;
}
.btn.primary:hover{background:#DCEAF9;border-color:var(--blue);color:var(--blue)}
.mailnote{font-size:11.5px;color:var(--ink3);line-height:1.65;margin-top:9px}
.mailnote b{color:var(--ink2)}

/* 面试材料与 AI 复核 */
.matbar{display:flex;gap:8px;align-items:center;margin-bottom:11px;flex-wrap:wrap}
.matcount{font-size:11.5px;color:var(--ink3)}
.mat{border:1px solid var(--line);border-radius:var(--radius-s);padding:11px 13px;margin-bottom:9px;background:var(--card);position:relative}
.mat .mmain{min-width:0}
.mat .mname{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px;word-break:break-all;padding-right:42px}
.mico{display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:5px;background:var(--blue-bg);color:var(--blue);font-size:11px;font-weight:600;flex-shrink:0;border:1px solid var(--blue-line)}
.mat .mmeta{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.55}
.mdel{position:absolute;right:11px;top:11px;font-size:11px;color:var(--ink3);text-decoration:underline;text-underline-offset:2px}
.mdel:hover{color:var(--red)}
.mabs{font-size:11px;color:var(--ink3);background:var(--bg);border:1px dashed var(--line);border-radius:6px;padding:7px 9px;margin-top:8px;line-height:1.6}
.mimg{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:7px;margin-top:9px}
.mimg img{width:100%;height:110px;object-fit:cover;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.mpreview{margin-top:9px;max-height:190px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:10px 12px}
.mpreview pre{font-family:"SF Mono",Consolas,"Courier New",monospace;font-size:11px;line-height:1.65;color:var(--ink2);white-space:pre-wrap;word-break:break-word;margin:0}
.matempty{font-size:12px;color:var(--ink3);background:var(--bg);border:1px dashed var(--line-strong);border-radius:var(--radius-s);padding:13px 15px;line-height:1.75}
.matempty b{color:var(--ink2)}

.aibox{margin-top:14px;border:1px solid var(--blue-line);background:#FAFCFF;border-radius:var(--radius);padding:13px 15px}
.aihead{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
.aititle{font-size:12.5px;font-weight:600}
.aistatus{font-size:11.5px;color:var(--ink3);display:flex;align-items:center;gap:5px;flex:1;min-width:120px}
.okdot,.nodont{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.okdot{background:var(--green)}
.nodont{background:var(--line-strong)}
.aibtns{display:flex;gap:8px;flex-wrap:wrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.ainote{font-size:11.5px;color:var(--ink3);line-height:1.65;margin-top:9px}
.ainote .warn{color:var(--amber)}

.aicfg{margin-top:11px;padding-top:11px;border-top:1px dashed var(--blue-line)}
.cfgrow{display:flex;align-items:center;gap:9px;margin-bottom:8px}

    }
    const m = migrateDecisions(cur);

    // 旧版 v1 数据迁移（在线链接升级后，已有标记自动保留）
    try {
      const v1raw = Store.get(LS_DECISION_V1);
      if (v1raw) {
        const v1 = JSON.parse(v1raw);
        if (v1 && typeof v1 === 'object') {
          const m1 = migrateDecisions(v1);
          Object.keys(m1).forEach((cid) => {
            if (!m[cid]) m[cid] = m1[cid];
          });
          Store.set(LS_DECISION, JSON.stringify(m));
          Store.del(LS_DECISION_V1);
        }
      }
    } catch (e) {}
    return m;
  }

  function saveDecision(cid, did, posId) {
    const m = loadDecisions();
    const log = loadLog();
    const t = Date.now();
    if (m[cid] && m[cid].dec === did) {
      const old = m[cid];
      delete m[cid];
      log.push({
        t, action: 'clear', cid, name: candName(cid), pos: posNameOf(old.pos),
        dec: old.dec, decLabel: (decOf(old.dec) || {}).label || old.dec,
      });
    } else {
      m[cid] = { dec: did, at: t, pos: posId || 'aijd' };
      log.push({
        t, action: 'set', cid, name: candName(cid), pos: posNameOf(posId || 'aijd'),
        dec: did, decLabel: (decOf(did) || {}).label || did,
      });
    }
    Store.set(LS_DECISION, JSON.stringify(m));
    Store.set(LS_LOG, JSON.stringify(log.slice(-LOG_MAX)));
    return m;
  }

  function decisionOf(cid) {
    return loadDecisions()[cid] || null;
  }

  function loadLog() {
    try {
      const raw = JSON.parse(Store.get(LS_LOG) || '[]');
      return Array.isArray(raw) ? raw : [];
    } catch (e) {
      return [];
    }
  }

  function clearAllDecisions() {
    const m = loadDecisions();
    const log = loadLog();
    const t = Date.now();
    Object.keys(m).forEach((cid) => {
      log.push({
        t, action: 'clear', cid, name: candName(cid), pos: posNameOf(m[cid].pos),
        dec: m[cid].dec, decLabel: (decOf(m[cid].dec) || {}).label || '—',
      });
    });
    Store.set(LS_LOG, JSON.stringify(log.slice(-LOG_MAX)));
    Store.del(LS_DECISION);
  }

  /* ---------- 导出 / 导入数据 ---------- */
  function doExport() {
    const payload = {
      version: 3,
      exportedAt: new Date().toISOString(),
      persistent: Store.persistent,
      decisions: loadDecisions(),
      log: loadLog(),
      resumeImage: Store.get(LS_RESUME) || null,
      interview: loadMats(), // 面试材料：录音元信息 / 逐字稿全文 / 纪要文本 / AI 复核结果
    };
    try {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const d = new Date();
      a.href = url;
      a.download = '候选人分析数据_' + d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + '.json';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) {} }, 800);
      return true;
    } catch (e) {
      alert('导出失败：' + (e && e.message ? e.message : e));
      return false;
    }
  }

  function doImport(file) {
    if (!file) return;
    const r = new FileReader();
    r.onload = (ev) => {
      let obj = null;
      try {
        obj = JSON.parse(ev.target.result);
      } catch (e) {
        alert('导入失败：文件不是有效的 JSON 数据。\n请使用本工具「导出数据」生成的文件。');
        return;
      }
      if (!obj || typeof obj !== 'object' || !obj.decisions || typeof obj.decisions !== 'object' || Array.isArray(obj.decisions)) {
        alert('导入失败：文件中缺少决策数据（decisions 字段）。\n请使用本工具「导出数据」生成的文件。');
        return;
      }
      const incoming = Object.keys(obj.decisions).length;
      const current = Object.keys(loadDecisions()).length;
      const logN = Array.isArray(obj.log) ? obj.log.length : 0;
      const matN = obj.interview && typeof obj.interview === 'object' ? countMats(obj.interview) : 0;
      const ok = window.confirm(
        '将导入 ' + incoming + ' 条决策记录' + (logN ? '（含操作流水 ' + logN + ' 条）' : '') +
        (matN ? '、' + matN + ' 份面试材料' : '') +
        '。\n\n注意：导入会【覆盖】当前已有的 ' + current + ' 条标记' + (matN ? '及现有面试材料' : '') + '。\n是否继续？'
      );
      if (!ok) return;
      const migrated = migrateDecisions(obj.decisions);
      Store.set(LS_DECISION, JSON.stringify(migrated));
      Store.set(LS_LOG, JSON.stringify(Array.isArray(obj.log) ? obj.log.filter((x) => x && typeof x === 'object').slice(-LOG_MAX) : []));
      if (typeof obj.resumeImage === 'string' && obj.resumeImage.indexOf('data:image') === 0) {
        Store.set(LS_RESUME, obj.resumeImage);
      }
      if (obj.interview && typeof obj.interview === 'object') {
        Store.set(LS_MATS, JSON.stringify(obj.interview));
      }
      renderRail();
      renderList();
      alert('导入完成 ✓ 共 ' + Object.keys(migrated).length + ' 条决策记录' + (matN ? '、' + matN + ' 份面试材料' : '') + '。');
    };
    r.readAsText(file);
  }

  /* ---------- 左侧列表（在招岗位 + 决策情况入口） ---------- */
  function renderRail() {
    const decCount = Object.keys(loadDecisions()).length;
    rail.innerHTML =
      '<div class="rail-h">在招岗位</div>' +
      POSITIONS.map((p) => {
        const on = currentView === 'pos' && p.id === currentPosId;
        const n = p.candidates ? p.candidates.length : 0;
        return `<button class="pos ${on ? 'on' : ''}" data-pos="${p.id}">
          <div class="pos-top">
            <span class="pos-dot ${p.status}"></span>
            <span class="pos-name">${esc(p.name)}</span>
          </div>
          <div class="pos-sub">${esc(p.subtitle)}</div>
          <span class="pos-badge">${p.status === 'pending' ? esc(p.statusLabel) : n + ' 位候选人'}</span>
        </button>`;
      }).join('') +
      '<div class="rail-h rail-gap">决策情况</div>' +
      `<button class="pos ${currentView === 'decisions' ? 'on' : ''}" data-view="decisions">
        <div class="pos-top">
          <span class="pos-dot ${decCount ? 'active' : 'pending'}"></span>
          <span class="pos-name">决策总览</span>
        </div>
        <div class="pos-sub">推进面试 · 人才池 · 不使用</div>
        <span class="pos-badge">${decCount} 条标记</span>
      </button>`;

    $$('.pos', rail).forEach((el) =>
      el.addEventListener('click', () => {
        if (el.dataset.view === 'decisions') {
          if (currentView === 'decisions') return;
          currentView = 'decisions';
          closePanel();
          renderRail();
          renderList();
          return;
        }
        if (currentView === 'pos' && el.dataset.pos === currentPosId) return;
        goPos(el.dataset.pos);
      })
    );
  }

  function goPos(pid) {
    currentView = 'pos';
    currentPosId = pid;
    closePanel();
    renderRail();
    renderList();
  }

  /* ---------- 中间区域分发 ---------- */
  function renderList() {
    if (currentView === 'decisions') return renderDecisions();
    const p = posOf(currentPosId);
    if (p.status === 'pending') return renderPending(p);
    renderCandidates(p);
  }

  /* ---------- 决策情况总览 ---------- */
  function renderDecisions() {
    const decs = loadDecisions();
    const allLog = loadLog();
    const entries = Object.keys(decs).map((cid) => Object.assign({ cid }, decs[cid]));
    const total = entries.length;
    const recent = allLog.slice().reverse().slice(0, LOG_SHOW);
    const latest = allLog.length ? allLog[allLog.length - 1].t : null;

    const groupsHTML = DECISIONS.map((d) => {
      const items = entries.filter((e) => e.dec === d.id);
      const rows = items.map((e) => {
        const f = findCandidate(e.cid);
        const alive = !!(f && f.c);
        const name = alive ? f.c.name : e.cid;
        const meta = alive && f.c.listMeta ? f.c.listMeta : '';
        const posName = alive ? f.pos.name : posNameOf(e.pos);
        return `<div class="drow">
          <div class="drow-main">
            <div class="dname">${esc(name)}<span class="tag ${d.cls}">${esc(d.short)}</span></div>
            <div class="dmeta">${esc(posName)}${meta ? ' · ' + esc(meta) : ''}${alive ? '' : ' · 该候选人已不在当前数据中'}</div>
          </div>
          <div class="dtime">${esc(fmtTs(e.at))}</div>
          ${alive ? `<button class="viewbtn" data-goto="${esc(e.cid)}">查看详情 →</button>` : ''}
        </div>`;
      }).join('');
      return `<section class="dsec">
        <div class="dsec-h"><span class="ldot ${DOT[d.cls]}"></span>${esc(d.label)}<span class="dcount ${d.cls}">${items.length}</span></div>
        ${rows || '<div class="dempty">暂无该类决策记录</div>'}
      </section>`;
    }).join('');

    const logHTML = recent.map((e) => {
      const who = esc(e.name || e.cid || '—');
      const where = esc(e.pos || '—');
      if (e.action === 'clear') {
        return `<div class="logline"><span class="lt">${esc(fmtTsShort(e.t))}</span><span class="ln">${who}</span><span class="lo">取消标记（原：${esc(e.decLabel || '—')}）</span><span class="lp">${where}</span></div>`;
      }
      return `<div class="logline"><span class="lt">${esc(fmtTsShort(e.t))}</span><span class="ln">${who}</span><span class="lo ${dotOf(e.dec)}">→ ${esc(e.decLabel || '—')}</span><span class="lp">${where}</span></div>`;
    }).join('');

    list.innerHTML = `
      <div class="list-h">
        <div class="list-title">决策情况</div>
        <div class="list-sub">共 ${total} 条决策记录${latest ? ' · 最近操作 ' + esc(fmtTsShort(latest)) : ''}</div>
      </div>
      <div class="list-desc">汇总所有岗位的决策标记（推进面试 / 进入人才池 / 不使用）。数据保存在本机浏览器；换电脑或备份时，用下方「导出 / 导入数据」即可整体迁移。</div>
      <div class="list-bar">
        <span style="font-size:11.5px;color:#8A8A83">导出 / 导入在页面右上角「候选人分析」旁，对应整个工具的数据</span>
        <div style="flex:1"></div>
        <button class="viewbtn" id="backToPos" style="margin-left:0">返回在招岗位 →</button>
        ${total ? '<button class="resetbtn" id="btnWipe" style="margin-left:10px">清除全部决策</button>' : ''}
      </div>
      ${
        total
          ? '<div class="dgroups">' + groupsHTML + '</div>'
          : `<div class="pendingBox">
              <div class="pi">
                <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
                  <path d="M11 6v6M11 15.5v.5"/>
                  <circle cx="11" cy="11" r="8.5"/>
                </svg>
              </div>
              <h3>还没有任何决策记录</h3>
              <p>进入「在招岗位」，在候选人卡片上点击「推进面试 / 进入人才池 / 不使用」后，<br>决策会自动汇总到这里，并生成可回溯的操作流水。</p>
            </div>`
      }
      ${
        allLog.length
          ? `<section class="dsec" style="margin-top:18px">
              <div class="dsec-h">操作流水<span class="dcount gray">最近 ${Math.min(allLog.length, LOG_SHOW)} 条 / 共 ${allLog.length} 条</span></div>
              <div class="logbox">${logHTML}</div>
            </section>`
          : total
            ? '<div style="font-size:11.5px;color:#8A8A83;margin-top:12px">以下标记产生于旧版本，暂无操作流水；之后每次标记或取消都会自动记录。</div>'
            : ''
      }`;

    const btnBack = $('#backToPos');
    if (btnBack) btnBack.addEventListener('click', () => goPos(POSITIONS[0].id));

    const btnWipe = $('#btnWipe');
    if (btnWipe)
      btnWipe.addEventListener('click', () => {
        if (!window.confirm('确定清除全部 ' + total + ' 条决策标记吗？\n（操作流水会保留记录，可追溯）')) return;
        clearAllDecisions();
        renderRail();
        renderList();
      });

    $$('.viewbtn[data-goto]', list).forEach((b) =>
      b.addEventListener('click', () => gotoCandidate(b.dataset.goto))
    );
  }

  function gotoCandidate(cid) {
    const f = findCandidate(cid);
    if (!f || f.pos.status !== 'active') {
      alert('该候选人所属岗位暂未开放详情视图。');
      return;
    }
    currentView = 'pos';
    currentPosId = f.pos.id;
    openCandidateId = null;
    renderRail();
    renderList();
    openPanel(cid);
  }

  /* 待更新岗位 */
  function renderPending(p) {
    const pd = p.pending;
    list.innerHTML = `
      <div class="list-h">
        <div class="list-title">${esc(p.name)}</div>
        <div class="list-sub">${esc(p.dept)} · 岗位编号 ${esc(p.id)}</div>
      </div>
      <div class="list-desc">该岗位尚未录入 JD 与候选人材料，当前为空态。</div>

      <div class="pendingBox">
        <div class="pi">
          <svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M11 6v6M11 15.5v.5"/>
            <circle cx="11" cy="11" r="8.5"/>
          </svg>
        </div>
        <h3>${esc(pd.title)}</h3>
        <p>${esc(pd.desc)}</p>

        <div class="todoList">
          <div class="tl">待办事项</div>
          <ul>${pd.todos.map((t) => `<li>${esc(t)}</li>`).join('')}</ul>
        </div>

        <div class="fwgrid">
          ${pd.framework
            .map(
              (f) => `<div class="fw"><span class="fk">${esc(f.k)}</span><span class="fv">${esc(f.v)}</span></div>`
            )
            .join('')}
        </div>
      </div>

      <div style="text-align:center;font-size:12px;color:#8A8A83;margin-top:14px">
        补齐 JD 与简历后，把文件发我即可一键填入并启动六维分析。
      </div>`;
  }

  /* 候选人列表 */
  function renderCandidates(p) {
    const decs = loadDecisions();
    const mats = loadMats();
    const doneCount = p.candidates.filter((c) => decs[c.id] && decs[c.id].dec).length;

    const rows = p.candidates.map((c) => {
      const dObj = decs[c.id];
      const dec = dObj ? dObj.dec : null;
      const decDef = dec ? decOf(dec) : null;
      const on = openCandidateId === c.id;

      const mini = ['K', 'S', 'A', 'O']
        .map((k) => {
          const v = c.ksa[k];
          const pend = k === 'O' && c.id !== 'zhong';
          return `<div class="mini-c"><span class="k">${k}</span><span class="v ${ksaCls(v)}">${v}${pend ? '*' : ''}</span></div>`;
        })
        .join('');

      const btns = DECISIONS.map(
        (d) =>
          `<button class="dbtn ${dec === d.id ? 'sel ' + d.cls : ''}" data-cid="${c.id}" data-dec="${d.id}" title="${esc(d.desc)}">${esc(d.label)}</button>`
      ).join('');

      return `
      <article class="row ${on ? 'on' : ''}" data-cid="${c.id}">
        <div class="row-top">
          <div class="avatar ${c.tier}">${esc(c.initial)}</div>
          <div class="row-id">
            <div class="row-name">
              ${esc(c.name)}
              <span class="tag ${c.tier}">${esc(c.tag)}</span>
              ${decDef ? `<span class="tag ${decDef.cls}">已标记 · ${esc(decDef.short)}</span>` : ''}
              ${matTag(mats[c.id], c)}
            </div>
            <div class="row-meta">${esc(c.listMeta)} · 来源：${esc(c.source)}</div>
          </div>
          <div class="scores">
            <div class="sc"><div class="lbl">KSAO</div><div class="val ${c.tier}">${c.ksa.total}</div></div>
            <div class="sc"><div class="lbl">相似度</div><div class="val ${simCls(c.similarity)}">${c.similarity}%</div></div>
            <div class="sc"><div class="lbl">STAR</div><div class="val ${ksaCls(c.star)}">${c.star}</div></div>
          </div>
        </div>

        <div class="row-mid">
          <div class="mini">${mini}</div>
          <div class="row-why">${esc(c.headline)}</div>
        </div>

        <div class="row-act">
          <span class="lb">决策</span>
          ${btns}
          <span class="status-note ${decDef ? decDef.cls : ''}" data-note="${c.id}">${
            decDef ? '当前：' + decDef.label : '建议：' + (decOf(c.recommend) ? decOf(c.recommend).label : '—')
          }</span>
          <button class="viewbtn" data-view="${c.id}">查看详情 →</button>
        </div>
      </article>`;
    }).join('');

    list.innerHTML = `
      <div class="list-h">
        <div class="list-title">${esc(p.name)}</div>
        <div class="list-sub">${esc(p.dept)} · 共 ${p.candidates.length} 位候选人 · 数据更新 ${esc(p.updated)}</div>
      </div>
      <div class="list-desc">${esc(p.jd ? p.jd.positioning : '')} —— 分析基准：《公司智能招聘系统 AI 分析优化方案 V1.4》六维融合体系</div>
      <div class="list-bar">
        <div class="legend"><span class="ldot g"></span>优先推荐</div>
        <div class="legend"><span class="ldot a"></span>有条件推荐</div>
        <div class="legend"><span class="ldot r"></span>不推荐本岗</div>
        <div style="flex:1"></div>
        <span style="font-size:11.5px;color:#8A8A83">已标记 ${doneCount} / ${p.candidates.length}</span>
        ${doneCount ? '<button class="resetbtn" id="resetDec">清除全部标记</button>' : ''}
        <button class="viewbtn" id="viewJD" style="margin-left:8px">查看岗位 JD →</button>
        <button class="viewbtn" id="viewDec" style="margin-left:8px">决策情况 →</button>
      </div>
      <div class="rows">${rows}</div>`;

    // 决策按钮
    $$('.dbtn', list).forEach((b) =>
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        const cid = b.dataset.cid;
        const did = b.dataset.dec;
        const keep = openCandidateId;
        saveDecision(cid, did, p.id);
        renderCandidates(p);
        openCandidateId = keep;
        $$('.row', list).forEach((r) => r.classList.toggle('on', r.dataset.cid === keep));
        if (keep && keep === cid) syncPanelDecision(cid);
      })
    );

    // 查看详情
    $$('.viewbtn[data-view]', list).forEach((b) =>
      b.addEventListener('click', (e) => {
        e.stopPropagation();
        openPanel(b.dataset.view);
      })
    );

    // 整行也可以点
    $$('.row', list).forEach((r) =>
      r.addEventListener('click', () => openPanel(r.dataset.cid))
    );

    const btnJD = $('#viewJD');
    if (btnJD) btnJD.addEventListener('click', () => openJD(p));

    const btnDec = $('#viewDec');
    if (btnDec)
      btnDec.addEventListener('click', () => {
        currentView = 'decisions';
        closePanel();
        renderRail();
        renderList();
      });

    const btnReset = $('#resetDec');
    if (btnReset)
      btnReset.addEventListener('click', () => {
        const keep = openCandidateId;
        clearAllDecisions();
        renderCandidates(p);
        openCandidateId = keep;
        $$('.row', list).forEach((r) => r.classList.toggle('on', r.dataset.cid === keep));
        if (keep) syncPanelDecision(keep);
      });

    barHint.innerHTML = Store.persistent
      ? '决策标记保存在本机浏览器，关闭后仍保留'
      : '<span style="color:#8A5309">当前为离线单文件模式，标记仅本次查看有效（关闭后不保留）</span>';
  }

  /* ---------- 详情面板：候选人 ---------- */
  function openPanel(cid) {
    const p = posOf(currentPosId);
    const c = p.candidates.find((x) => x.id === cid);
    if (!c) return;
    openCandidateId = cid;

    pName.textContent = c.name;
    pMeta.textContent = c.meta;
    pAvatar.className = 'avatar ' + c.tier;
    pAvatar.textContent = c.initial;
    pBody.innerHTML = buildCandidateDetail(c);
    panel.classList.add('open');

    $$('.row', list).forEach((r) => r.classList.toggle('on', r.dataset.cid === cid));
    bindResume(c);
    bindMail(c);
    bindPanelDecision(c);
    bindMats(c);
  }

  function closePanel() {
    openCandidateId = null;
    panel.classList.remove('open');
    $$('.row', list).forEach((r) => r.classList.remove('on'));
  }

  function syncPanelDecision(cid) {
    const host = $('#panelDecision');
    if (!host) return;
    const dObj = decisionOf(cid);
    const dec = dObj ? dObj.dec : null;
    const def = dec ? decOf(dec) : null;
    host.innerHTML = decisionButtonsHTML(cid, dec) +
      `<span class="status-note ${def ? def.cls : ''}">${def ? '当前：' + def.label : '尚未标记'}</span>`;
    bindDecisionBtns(host, cid);
  }

  function decisionButtonsHTML(cid, dec) {
    return DECISIONS.map(
      (d) =>
        `<button class="dbtn ${dec === d.id ? 'sel ' + d.cls : ''}" data-cid="${cid}" data-dec="${d.id}" title="${esc(d.desc)}">${esc(d.label)}</button>`
    ).join('');
  }

  function bindDecisionBtns(host, cid) {
    $$('.dbtn', host).forEach((b) =>
      b.addEventListener('click', () => {
        saveDecision(cid, b.dataset.dec, posOf(currentPosId).id);
        syncPanelDecision(cid);
        const keep = openCandidateId;
        renderCandidates(posOf(currentPosId));
        openCandidateId = keep;

    c.highlights.forEach((h, i) => push((i + 1) + '）' + h.t + '：' + h.d));
    push('');
    push('五、风险与存疑');
    c.risks.forEach((r, i) => push((i + 1) + '）' + r.t + '：' + r.d));

      alert('收件邮箱格式不正确，请检查后重试。\n当前填写：' + to);

    const href = 'mailto:' + encodeURIComponent(to) +
      '?subject=' + encodeURIComponent(subject) +

  /* ---------- 拖入简历图片 ---------- */
  function bindResume(c) {
    if (c.resume.type !== 'image') return;
    const zone = $('#dropZone');
    const box = $('#dropImgBox');
    const img = $('#dropImg');
    const tools = $('#dropTools');
    const input = $('#fileInput');
    if (!zone) return;

    const show = (src) => {
      img.src = src;
      box.style.display = 'block';
      tools.style.display = 'flex';
      zone.style.display = 'none';
    };

    try {
      const saved = Store.get(LS_RESUME);
      if (saved) show(saved);
    } catch (e) {}

    const readFile = (file) => {
      if (!file || !file.type.startsWith('image/')) return;
      const r = new FileReader();
      r.onload = (ev) => show(ev.target.result);
      r.readAsDataURL(file);
    };

    zone.addEventListener('click', () => input.click());
    input.addEventListener('change', (e) => readFile(e.target.files[0]));

    ['dragenter', 'dragover'].forEach((ev) =>
      zone.addEventListener(ev, (e) => {
        e.preventDefault();
        zone.classList.add('over');
      })
    );
    ['dragleave', 'drop'].forEach((ev) =>
      zone.addEventListener(ev, (e) => {
        e.preventDefault();
        zone.classList.remove('over');
      })
    );
    zone.addEventListener('drop', (e) => readFile(e.dataTransfer.files && e.dataTransfer.files[0]));

    const btnSave = $('#btnSaveLocal');
    if (btnSave)
      btnSave.addEventListener('click', () => {
        const saved = Store.set(LS_RESUME, img.src);

  /* ============================================================
     面试材料模块（V3）
       1) 录音音频导入 —— 存档 + 播放 + 时长（浏览器不做语音识别，转写需外部工具）
       2) 录音逐字稿导入 —— txt / srt / vtt，解析时间轴与说话人
       3) 会议纪要导入 —— .docx 零依赖解析（原生 DecompressionStream 解 ZIP），提取文字与图片
       4) AI 复核 —— 简历六维结论 × 面试表现交叉验证，输出言行一致性与更新建议
     ============================================================ */

  const AUDIO_URLS = {}; // 本次会话内的音频播放地址（音频本体不落盘）
  const MINUTES_IMG = {}; // 本次会话内的纪要图片地址

  /* ---------- 材料存储 ---------- */
  function loadMats() {
    try {
      const raw = JSON.parse(Store.get(LS_MATS) || '{}');
      return raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
    } catch (e) {
      return {};
    }
  }
  function saveMats(m) {
    try {
      return Store.set(LS_MATS, JSON.stringify(m));
    } catch (e) {
      return false;
    }
  }
  function matOf(cid) {
    return loadMats()[cid] || {};
  }
  function setMat(cid, kind, obj) {
    const m = loadMats();
    const one = m[cid] || {};
    one[kind] = obj;
    m[cid] = one;
    return saveMats(m);
  }
  function delMat(cid, kind) {
    const m = loadMats();
    if (!m[cid]) return true;
    delete m[cid][kind];
    if (kind !== 'analysis') delete m[cid].analysis; // 材料变更后，原复核结果不再对应当前证据
    if (!Object.keys(m[cid]).length) delete m[cid];
    return saveMats(m);
  }
  function countMats(map) {
    let n = 0;
    Object.keys(map || {}).forEach((cid) => {
      const o = map[cid] || {};
      ['audio', 'transcript', 'minutes'].forEach((k) => { if (o[k]) n++; });
    });
    return n;
  }
  function matTag(o, c) {
    if (!o) return '';
    if (o.analysis) {
      const rr = o.analysis.result || {};
      // 面试后结论与简历阶段不一致时，列表里直接把变化顶出来
      const chg = !!(c && rr.recommend && c.recommend && rr.recommend !== c.recommend);
      return chg
        ? '<span class="tag amber">AI 复核 · 结论有变化</span>'
        : '<span class="tag green">AI 已复核</span>';
    }
    if (o.audio || o.transcript || o.minutes) return '<span class="tag blue">已录面试材料</span>';
    return '';
  }

  /* ---------- 密钥清洗与错误归因 ----------
     从网页复制密钥时极易带上首尾空格、换行、零宽字符，
     或整段「Authorization: Bearer xxx」，这些都会让服务端判为无效。
     这里统一清洗，并在失败时给出可自行判断的线索。 */
  function normKey(raw) {
    let s = String(raw == null ? '' : raw);
    s = s.replace(/[\u200B-\u200D\uFEFF]/g, ''); // 零宽字符
    s = s.replace(/\s+/g, ''); // 空格、换行、制表符
    s = s.replace(/^(?:authorization\s*:\s*)?bearer/i, ''); // 误带 Bearer 前缀
    s = s.replace(/^["'`<]+/, '').replace(/["'`>]+$/, ''); // 首尾引号/尖括号
    s = s.replace(/[,;，；]+$/, ''); // 误带的标点
    return s;
  }
  function keyLook(k) {
    const s = String(k || '');
    return { len: s.length, head: s.slice(0, 6), tail: s.slice(-4), dots: (s.match(/\./g) || []).length };
  }
  // 智谱密钥形如：32位ID.16位Secret —— 长度明显不符即可判定「没复制全」
  function keyShapeWarn(k) {
    const s = String(k || '');
    if (!s) return '';
    if (/^[0-9a-f]{32}\.[0-9a-zA-Z]{16}$/i.test(s)) return '';
    if (/^sk-[0-9a-zA-Z_-]{20,}$/.test(s)) return '';
    if (s.length < 30) return '密钥仅 ' + s.length + ' 位，明显短于正常长度，很可能没复制完整';
    if (s.indexOf('.') < 0 && /^[0-9a-f]{32}$/i.test(s)) return '这段只有前半部分（点号后的 Secret 缺了），请重新复制完整密钥';
    return '';
  }
  function hitNetwork(e) {
    const m = String((e && e.message) || e || '');
    return (e && e.name === 'TypeError') || /failed to fetch|networkerror|load failed|network request failed/i.test(m);
  }
  const delayAI = (ms) => new Promise((r) => setTimeout(r, ms));
  function aiErr(status, body, model) {
    const raw = String(body == null ? '' : body).replace(/\s+/g, ' ').slice(0, 200);
    let msg;
    if (status === 401) {
      msg = '密钥未被接受（HTTP 401，原始返回：' + raw + '）。请按顺序核对三点：①上方「服务商」是否与密钥来源一致——智谱的密钥不能用在硅基流动或 Kimi 上；②密钥是否复制完整、有没有带进空格换行（本工具已自动清理一次）；③该密钥是否已被删除或停用。';
    } else if (status === 403) {
      msg = '服务端拒绝访问（HTTP 403，原始返回：' + raw + '）。密钥本身多半没问题，常见原因是账号未完成实名认证，或该模型还没开通调用权限——请登录 open.bigmodel.cn 控制台检查「实名认证」与模型权限。';
    } else if (status === 429) {
      const overload = /访问量过大|过载|繁忙|busy|overload|too many/i.test(raw);
      msg = overload
        ? '智谱这个模型此刻访问量过大（HTTP 429，原始返回：' + raw + '）。免费模型并发只有 1 路，高峰期很常见；工具会自动重试并尝试备用模型。若仍不行，过几分钟或换个时段再试。'
        : '调用超出限制（HTTP 429，原始返回：' + raw + '）。可能是并发超过 1 路，或免费额度/当日调用量已用尽，可到智谱控制台查看用量；工具会自动重试，稍等即可。';
    } else if (status >= 500) {
      msg = '智谱服务端临时故障（HTTP ' + status + '），与你的密钥无关，稍后重试即可。原始返回：' + raw;
    } else {
      msg = '接口返回 HTTP ' + status + '。原始返回：' + raw;
    }
    const e = new Error(msg);
    // 400/404 且提示与模型有关 → 允许自动换模型重试
    if ((status === 400 || status === 404) && /model|模型/i.test(raw)) e.modelMiss = true;
    // 429 过载 → 先延迟重试同一模型，再考虑换模型；5xx → 延迟重试
    if (status === 429) e.modelBusy = true;
    if (status >= 500) e.serverBusy = true;
    return e;
  }

  function loadAI() {

        if (model && prov.models.indexOf(model) < 0) model = prov.model;

  /* ---------- 连通性测试（配好密钥后点一下即可确认） ---------- */
  function testAI(cfg) {
    const prov = aiProvider(cfg.provider);
    const key = normKey(cfg.apiKey);
    const t0 = Date.now();
    const list = [];
    const first = cfg.model || prov.model;
    if (first) list.push(first);
    prov.models.forEach((m) => { if (list.indexOf(m) < 0) list.push(m); });

    function attempt(i, retried) {
      if (i >= list.length) throw new Error('清单内所有模型都不可用，请联系我核对模型名。');
      const model = list[i];
      const body = {
        model,
        messages: [{ role: 'user', content: '只回复两个字：正常' }],
        temperature: 0,
        max_tokens: 64,
        stream: false,
      };
      // GLM-4.5 及以上默认开启「深度思考」，思考会先消耗输出额度导致正文为空——测试类小请求直接关闭
      if (prov.id === 'zhipu') body.thinking = { type: 'disabled' };
      return fetch(prov.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
        body: JSON.stringify(body),
      })
        .then((r) => {
          if (!r.ok) return r.text().then((t) => { throw aiErr(r.status, t, model); });
          return r.json();
        })
        .then((j) => {
          const m = j && j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message : null;
          const txt = m ? (m.content || m.reasoning_content || '') : '';
          if (!txt) throw new Error('接口连通但没返回内容（模型 ' + model + '）');
          return { ms: Date.now() - t0, reply: String(txt).trim().slice(0, 30), model };
        })
        .catch((e) => {
          if (hitNetwork(e)) {
            throw new Error('网络请求没能发出去（浏览器报 Failed to fetch）。请确认电脑能正常上网、没挂代理或 VPN；并换用最新版 Chrome / Edge 打开本工具再试。');
          }
          // 模型繁忙（429）/ 服务端抖动（5xx）：先等 1.2 秒重试同一模型，仍不行再换备用模型
          if (e && (e.modelBusy || e.serverBusy)) {
            if (!retried) return delayAI(1200).then(() => attempt(i, true));
            if (i + 1 < list.length) return attempt(i + 1, false);
          }
          if (e && e.modelMiss && i + 1 < list.length) return attempt(i + 1, false);
          throw e;
        });
    }

    return Promise.resolve()
      .then(() => attempt(0, false))
      .catch((e) => {
        const k = keyLook(key);
        const shape = keyShapeWarn(key);
        const diag = '［自检：密钥 ' + k.len + ' 位，' + k.head + '…' + k.tail + '，含 ' + k.dots + ' 个点' +
          (shape ? '；' + shape : '') + (list.length > 1 ? '；候选模型 ' + list.join(' → ') : '') + '］';
        const err = new Error(((e && e.message) || String(e)) + '　' + diag);
        err.diag = diag;
        err.keyLen = k.len;
        err.keyShape = shape;
        throw err;
      });
  }

  /* ---------- 格式化 ---------- */
  function fmtDur(sec) {
    if (!sec || !isFinite(sec)) return '时长未知';
    const s = Math.round(sec);
    const h = Math.floor(s / 3600);
    const m = Math.floor((s % 3600) / 60);
    return (h ? h + ' 小时 ' : '') + (m ? m + ' 分 ' : '') + (s % 60) + ' 秒';
  }
  function fmtSize(b) {
    if (!b) return '0 KB';
    return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
  }

  /* ---------- 零依赖 ZIP 解析（用于 .docx） ---------- */
  async function inflateRaw(bytes) {
    if (typeof DecompressionStream !== 'function') {
      throw new Error('当前浏览器不支持解压功能，请改用最新版 Chrome 或 Edge 打开本工具。');
    }
    const ds = new DecompressionStream('deflate-raw');
    const readAll = new Response(ds.readable).arrayBuffer();
    const writer = ds.writable.getWriter();
    writer.write(bytes).then(() => writer.close()).catch(() => {});
    return new Uint8Array(await readAll);
  }

  async function unzip(buf) {
    const dv = new DataView(buf);
    const len = buf.byteLength;
    let eocd = -1;
    for (let i = len - 22; i >= Math.max(0, len - 66000); i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error('文件不是有效的 zip / docx 结构');
    const total = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const dec = new TextDecoder('utf-8');
    const map = {};
    for (let i = 0; i < total && p + 46 <= len; i++) {
      if (dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true);
      const csize = dv.getUint32(p + 20, true);
      const fnLen = dv.getUint16(p + 28, true);
      const exLen = dv.getUint16(p + 30, true);
      const cmLen = dv.getUint16(p + 32, true);
      const lho = dv.getUint32(p + 42, true);
      const name = dec.decode(new Uint8Array(buf, p + 46, fnLen));
      const lfnLen = dv.getUint16(lho + 26, true);
      const lexLen = dv.getUint16(lho + 28, true);
      const start = lho + 30 + lfnLen + lexLen;
      const raw = new Uint8Array(buf, start, csize);
      if (method === 0) map[name] = raw;
      else if (method === 8) map[name] = await inflateRaw(raw);
      p += 46 + fnLen + exLen + cmLen;
    }
    return map;
  }

  const NS_W = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
  const NS_A = 'http://schemas.openxmlformats.org/drawingml/2006/main';
  const NS_R = 'http://schemas.openxmlformats.org/officeDocument/2006/relationships';

  async function parseDocx(file) {
    const buf = await file.arrayBuffer();
    const zip = await unzip(buf);
    const docXml = zip['word/document.xml'];
    if (!docXml) {
      throw new Error('无法读取 Word 正文。若是老版 .doc，请在 Word 中「另存为 .docx」后重试。');
    }
    const dec = new TextDecoder('utf-8');
    const dom = new DOMParser().parseFromString(dec.decode(docXml), 'application/xml');

    const relMap = {};
    const relXml = zip['word/_rels/document.xml.rels'];
    if (relXml) {
      const rdom = new DOMParser().parseFromString(dec.decode(relXml), 'application/xml');
      [...rdom.getElementsByTagName('Relationship')].forEach((el) => {
        relMap[el.getAttribute('Id')] = el.getAttribute('Target');
      });
    }

    const paras = [];
    const targets = [];
    [...dom.getElementsByTagNameNS(NS_W, 'p')].forEach((pEl) => {
      const txt = [...pEl.getElementsByTagNameNS(NS_W, 't')].map((t) => t.textContent).join('');
      if (txt.trim()) paras.push(txt.replace(/\s+/g, ' ').trim());
      [...pEl.getElementsByTagNameNS(NS_A, 'blip')].forEach((b) => {
        const rid = b.getAttributeNS(NS_R, 'embed');
        const tgt = rid ? relMap[rid] : null;
        if (tgt) targets.push(tgt);
      });
    });

    const images = [];
    const seen = {};
    targets.forEach((t) => {
      const key = 'word/' + String(t).replace(/^\/?word\//, '').replace(/^\.\.\//, '');
      if (seen[key] || !zip[key]) return;
      seen[key] = 1;
      const ext = (key.split('.').pop() || 'png').toLowerCase();
      const mime = ext === 'jpg' || ext === 'jpeg' ? 'image/jpeg'
        : ext === 'gif' ? 'image/gif'
        : ext === 'svg' ? 'image/svg+xml'
        : ext === 'emf' || ext === 'wmf' ? ''
        : 'image/png';
      if (!mime) return; // emf/wmf 浏览器无法直接显示，跳过
      images.push({ name: key.split('/').pop(), url: URL.createObjectURL(new Blob([zip[key]], { type: mime })) });
    });

    return { text: paras.join('\n'), images };
  }

  /* ---------- 逐字稿解析（txt / srt / vtt） ---------- */
  const TIME_RE = /(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})?\s*-->\s*(\d{1,2}):(\d{2}):(\d{2})[,.](\d{1,3})?/;

  function splitSpeaker(line) {
    const m = String(line).match(/^\s*(?:\[[\d:.\s]+\]\s*)?([^：:]{1,12}?)\s*[：:]\s*(.+)$/);
    if (!m) return { who: '', say: line };
    const who = m[1].trim();
    if (!who || /^\d+$/.test(who)) return { who: '', say: line };
    return { who, say: m[2] };
  }

  function parseSubtitle(text, fileName) {
    const src = String(text).replace(/\r/g, '');
    const ext = (String(fileName).split('.').pop() || '').toLowerCase();
    const cues = [];

    if (TIME_RE.test(src) || ext === 'srt' || ext === 'vtt' || ext === 'ass') {
      src.split(/\n{2,}/).forEach((block) => {
        const m = block.match(TIME_RE);
        if (!m) return;
        const start = +m[1] * 3600 + +m[2] * 60 + +m[3];
        const end = +m[5] * 3600 + +m[6] * 60 + +m[7];
        const body = block
          .split('\n')
          .filter((l) => l.trim() && !TIME_RE.test(l) && !/^\d+$/.test(l.trim()) && !/^WEBVTT/i.test(l))
          .join(' ')
          .trim();
        if (body) cues.push({ start, end, text: body });
      });
    }

    let full;
    let speakers = [];
    if (cues.length) {
      const all = cues.map((c) => {
        const sp = splitSpeaker(c.text);
        return sp.who ? sp.who + '：' + sp.say : c.text;
      });
      speakers = [...new Set(cues.map((c) => splitSpeaker(c.text).who).filter(Boolean))];
      full = all.join('\n');
    } else {
      full = src.replace(/\n{3,}/g, '\n\n').trim();
      speakers = [...new Set(full.split('\n').map((l) => splitSpeaker(l).who).filter(Boolean))];
    }

    return {
      format: cues.length ? (ext === 'vtt' ? 'vtt' : 'srt') : 'txt',
      cueCount: cues.length,
      speakers,
      chars: full.length,
      truncated: full.length > TRANSCRIPT_MAX,
      text: full.slice(0, TRANSCRIPT_MAX),
    };
  }

  /* ---------- 音频元信息 ---------- */
  function readAudioMeta(file) {
    return new Promise((resolve) => {
      const url = URL.createObjectURL(file);
      let done = false;
      const fin = (d) => { if (!done) { done = true; resolve({ url, duration: d }); } };
      try {
        const a = document.createElement('audio');
        a.preload = 'metadata';
        a.onloadedmetadata = () => fin(isFinite(a.duration) ? a.duration : 0);
        a.onerror = () => fin(0);
        a.src = url;
        setTimeout(() => fin(isFinite(a.duration) ? a.duration : 0), 1500);
      } catch (e) {
        fin(0);
      }
    });
  }

  /* ---------- 三个导入入口 ---------- */
  function noteMat(msg, tone) {
    const el = $('#matNote');
    if (!el) return;
    el.innerHTML = '<span class="' + (tone === 'amber' ? 'warn' : 'ok') + '">' + esc(msg) + '</span>';
  }

  function importAudio(c, file) {
    if (!/\.(mp3|m4a|wav|aac|ogg|opus|flac|wma|amr|mp4|webm|m4v)$/i.test(file.name) && !/^audio\//.test(file.type || '')) {
      alert('请选择音频文件（mp3 / m4a / wav / aac 等）。');
      return;
    }
    readAudioMeta(file).then((meta) => {
      const saved = setMat(c.id, 'audio', {
        name: file.name, size: file.size, duration: meta.duration, addedAt: Date.now(),
      });
      AUDIO_URLS[c.id] = meta.url;
      renderMats(c);
      noteMat(saved === false && !Store.persistent
        ? '当前为离线单文件模式，材料仅本次会话有效。'
        : '录音已登记。音频原文件不复制、不上传，需要回听请在展开的播放器中播放。', 'ok');
    });

  function saveTranscript(c, text, fileName, kind) {
    let parsed;
    try {
      parsed = parseSubtitle(text, fileName);
    } catch (e) {
      alert('逐字稿解析失败：' + (e && e.message ? e.message : e));
      return;
    }
    if (!parsed.text) { alert('逐字稿内容为空，请检查文件。'); return; }
    const saved = setMat(c.id, 'transcript', {
      name: fileName, format: kind || parsed.format, chars: parsed.chars,
      cueCount: parsed.cueCount, speakers: parsed.speakers,
      truncated: parsed.truncated, text: parsed.text, addedAt: Date.now(),
    });
    renderMats(c);
    noteMat(saved === false
      ? '逐字稿较长或本机存储受限，可能未完整保存；建议先导出数据进行备份。'
      : '逐字稿已导入（' + parsed.chars + ' 字' + (parsed.cueCount ? '，' + parsed.cueCount + ' 条字幕' : '') + '）。', saved === false ? 'amber' : 'ok');
  }

  function importTranscript(c, file) {
    const name = String(file.name || '');
    if (/\.doc$/i.test(name)) {
      alert('老版 .doc 无法直接解析。\n请在 Word 中「另存为」选择 .docx（或「纯文本(*.txt)」）后重试。');
      return;
    }
    // Word 逐字稿：与会议纪要共用同一套零依赖解压逻辑（录音转写工具常导出 .docx）
    if (/\.docx$/i.test(name)) {
      parseDocx(file)
        .then((res) => {
          if (!res.text.trim()) {
            alert('未能从该 Word 中提取到文字。若正文是图片截图，请改用 txt / srt 逐字稿。');
            return;
          }
          saveTranscript(c, res.text, name, 'docx');
        })
        .catch((e) => alert('Word 逐字稿解析失败：' + (e && e.message ? e.message : e)));
      return;
    }
    const r = new FileReader();
    r.onload = (ev) => {
      const raw = String(ev.target.result || '');
      // 二进制文件被当成文本读会出现大量替换字符，明确告诉用户怎么转换
      if ((raw.match(/\uFFFD/g) || []).length > 20) {
        alert('这个文件不是纯文本，无法直接读取。\n请在 Word 中「另存为」选择「纯文本(*.txt)」，或直接上传 .docx 文件。');
        return;
      }
      saveTranscript(c, raw, name, '');
    };
    r.onerror = () => alert('文件读取失败，请重试。');
    r.readAsText(file, 'utf-8');
  }

  function importMinutes(c, file) {
    if (!/\.docx$/i.test(file.name)) {
      alert('目前只支持 .docx 格式的 Word 文件。\n若是老版 .doc，请在 Word 中「另存为」选择 .docx 后重试。');
      return;
    }
    parseDocx(file)
      .then((res) => {
        if (!res.text.trim() && !res.images.length) {
          alert('未能从该 Word 中提取到文字或图片，请确认文件内容。');
          return;
        }
        const saved = setMat(c.id, 'minutes', {
          name: file.name, chars: res.text.length, imageCount: res.images.length,
          text: res.text.slice(0, TRANSCRIPT_MAX), addedAt: Date.now(),
        });
        MINUTES_IMG[c.id] = res.images;
        renderMats(c);
        noteMat('会议纪要已导入：' + res.text.length + ' 字' + (res.images.length ? '、' + res.images.length + ' 张图片' : '') + '。' + (saved === false ? '（存储受限，可能未持久化）' : ''), saved === false ? 'amber' : 'ok');
      })
      .catch((e) => alert('Word 解析失败：' + (e && e.message ? e.message : e)));
  }

    if (o.audio) {
      L.push('');
      L.push('【补充】现场录音文件：' + o.audio.name + '，时长 ' + fmtDur(o.audio.duration) + '（音频内容未提供文字，请勿臆测录音中的原话）。');
    }

    L.push('');
    L.push('请只输出一个 JSON 对象，不要任何解释文字、不要代码块标记。结构如下：');
    L.push('{');
    L.push('  "consistency": {"level":"high|mid|low","label":"高|中高|中|偏低","note":"一句话判断依据，须引用面试中的具体表现"},');
    L.push('  "verified": [{"claim":"简历中的某项声称","evidence":"面试中对应的证据；若缺失就写未观察到","verdict":"证实|部分证实|存疑|推翻"}],');
    L.push('  "unresolved": ["简历疑点中面试仍未澄清的条目"],');
    L.push('  "newFindings": [{"t":"面试新发现（亮点或问题）","d":"说明"}],');
    L.push('  "dimensions": [{"name":"面试现场观察到的新增能力点","score":4,"note":"依据"}],');
    L.push('  "post": {"K":{"score":4.2,"note":"相对简历升高/降低的原因，须引用面试中的具体证据"},"S":{"score":4.5,"note":""},"A":{"score":4.3,"note":""},"O":{"score":3.5,"note":""},"star":{"score":4.5,"note":""},"similarity":88},');
    L.push('  "summary": "面试后的综合判断，150-250 字",');
    L.push('  "recommend": "interview|pool|reject",');
    L.push('  "recommendWhy": "一句话结论建议"');
    L.push('}');
    L.push('');
    L.push('关于 "post"（用于生成「简历阶段 × 面试复核后」对比卡，必须完整给出）：');
    L.push('1. 它是你在面试证据基础上，对**简历阶段同一套维度**给出的修正分：K/S/A/O/star 为 0-5（可带一位小数），similarity 为 0-100 整数。');
    L.push('2. 五个维度一个都不能少；note 必须写清「为什么升 / 为什么降」，并引用面试中的具体表现，禁止照抄简历原文。');
    L.push('3. 若某维度在面试中没有获得新信息，就沿用简历分数，并在 note 里写明「无新增证据」。');
    L.push('4. 修正分的升降幅度要有节制：只有出现明确证据时才调整，单次调整通常不超过 1.0 分。');
    return L.join('\n');
  }

  function parseAIJSON(txt) {
    let s = String(txt).trim();
    s = s.replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
    const a = s.indexOf('{');
    const b = s.lastIndexOf('}');
    if (a >= 0 && b > a) s = s.slice(a, b + 1);
    return JSON.parse(s);
  }

  function callAI(cfg, prompt, retried) {
    const prov = aiProvider(cfg.provider);
    const key = normKey(cfg.apiKey);
    const model = cfg.model || prov.model;
    const body = {
      model,
      messages: [
        { role: 'system', content: '你是严谨的招聘面试评估专家，只输出符合要求的 JSON，不输出任何额外文字。' },
        { role: 'user', content: prompt },
      ],
      temperature: 0.3,
      stream: false,
    };
    // 智谱 GLM-4.5+ 默认深度思考：分析任务保留思考（质量更好），输出额度给足由服务端默认上限兜底
    if (prov.id === 'zhipu') body.thinking = { type: 'enabled' };
    return fetch(prov.url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key },
      body: JSON.stringify(body),
    }).then((r) => {
      if (!r.ok) return r.text().then((t) => { throw aiErr(r.status, t, model); });
      return r.json();
    }).then((j) => {
      const m = j && j.choices && j.choices[0] && j.choices[0].message ? j.choices[0].message : null;
      let txt = m ? (m.content || '') : '';
      if (!txt && m && m.reasoning_content) txt = m.reasoning_content; // 深度思考模式下从思考内容中兜底提取 JSON
      if (!txt) throw new Error('接口未返回有效内容（可能是额度、模型名或内容过长）。稍等几分钟再点一次「重新分析」。');
      try {
        return parseAIJSON(txt);
      } catch (e) {
        throw new Error('模型这次没按 JSON 格式返回（内容已丢弃）。可再点一次「重新分析」，或换用 glm-4.7-flash 这类更强的模型。');
      }
    }).catch((e) => {
      if (hitNetwork(e)) {
        throw new Error('网络请求没能发出去（浏览器报 Failed to fetch）：请确认能正常上网、没挂代理或 VPN，并换用最新版 Chrome / Edge 打开本工具。');
      }
      // 高峰期模型繁忙 / 服务端抖动：等 3 秒自动重试一次，不让用户白等一场
      if (e && (e.modelBusy || e.serverBusy) && !retried) {
        return delayAI(3000).then(() => callAI(cfg, prompt, true));
      }
      throw e;
    });
  }

  function runAIAnalysis(c) {
    const cfg = loadAI();
    const o = matOf(c.id);
    if (!cfg.apiKey) {
      noteMat('尚未配置 API Key —— 请先点「AI 设置」填入密钥，或改用「生成分析请求」。', 'amber');
      return;
    }
    if (!o.transcript && !o.minutes) {
      noteMat('请先导入逐字稿或会议纪要：只有录音文件无法进行分析。', 'amber');
      return;
    }
    const p = posOf(currentPosId);
    const btn = $('#btnAIRun');
    if (btn) { btn.disabled = true; btn.textContent = 'AI 分析中…'; }
    noteMat('正在请求 ' + aiProvider(cfg.provider).name + '（' + (cfg.model || aiProvider(cfg.provider).model) + '），逐字稿较长时可能需要 20-60 秒；若遇模型繁忙会自动重试，请勿关闭页面…', 'ok');

    callAI(cfg, buildAIRequest(c, p, o))
      .then((result) => {
        setMat(c.id, 'analysis', {
          at: Date.now(),
          provider: cfg.provider,
          model: cfg.model || aiProvider(cfg.provider).model,
          basis: { transcript: !!o.transcript, minutes: !!o.minutes, audio: !!o.audio },
          result,
        });
        renderMats(c);
        renderList();
        noteMat('AI 复核完成 ✓ 结果已保存在本机。', 'ok');
      })
      .catch((e) => {
        if (btn) { btn.disabled = false; btn.textContent = '重新分析'; }
        noteMat('AI 分析失败：' + (e && e.message ? e.message : e) + '（可改用「生成分析请求」复制到任意 AI 中执行）', 'amber');
      });
  }

  function copyAIRequest(c) {
    const o = matOf(c.id);
    if (!o.transcript && !o.minutes) { noteMat('请先导入逐字稿或会议纪要。', 'amber'); return; }
    const text = buildAIRequest(c, posOf(currentPosId), o);
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    noteMat(ok
      ? '分析请求已复制（' + text.length + ' 字）。粘贴到任意 AI 对话框发送，得到 JSON 结果后再粘回工具即可。'
      : '复制失败，请手动选中复制。', ok ? 'ok' : 'amber');
  }

  /* ---------- 结果渲染 ---------- */
  function verdictCls(v) {
    const s = String(v || '');
    if (s.indexOf('推翻') >= 0) return 'red';
    if (s.indexOf('证实') >= 0) return s.indexOf('部分') >= 0 ? 'amber' : 'green';
    if (s.indexOf('存疑') >= 0) return 'amber';
    return 'gray';
  }

  /* ---------- 先后对比卡：简历阶段 → 面试复核后 ---------- */
  function dltCls(d, up, down) {
    if (d >= up) return 'up';
    if (d <= -down) return 'down';
    return 'same';
  }
  function renderCompare(c, a) {
    const r = a.result || {};
    const post = r.post;
    if (!post || typeof post !== 'object') return ''; // 旧版结果没有 post 字段，不渲染
    const k = c.ksa || {};
    const pairs = [
      ['K 知识', k.K, post.K],
      ['S 技能', k.S, post.S],
      ['A 能力', k.A, post.A],
      ['O 特质', k.O, post.O],
      ['STAR 行为面试', c.star, post.star],
    ];
    const rows = [];
    let up = 0;
    let down = 0;
    pairs.forEach((it) => {
      const base = it[1];
      const raw = it[2];
      const nv = raw && typeof raw === 'object' ? raw.score : raw;
      if (base == null || nv == null || !isFinite(+nv)) return;
      const d = Math.round(((+nv) - (+base)) * 10) / 10;
      const dir = dltCls(d, 0.25, 0.25);
      if (dir === 'up') up++;
      else if (dir === 'down') down++;
      rows.push(`<div class="cmp-row">
        <span class="cmp-dim">${esc(it[0])}</span>
        <span class="cmp-val">${esc(String(base))}</span>
        <span class="cmp-dlt ${dir}">${dir === 'up' ? '↑' : dir === 'down' ? '↓' : '→'}${d === 0 ? '' : (d > 0 ? '+' : '') + d.toFixed(1)}</span>
        <span class="cmp-val strong">${esc(String(nv))}</span>
        <span class="cmp-note" title="${esc((raw && raw.note) || '')}">${esc((raw && raw.note) || '')}</span>
      </div>`);
    });
    if (post.similarity != null && isFinite(+post.similarity) && c.similarity != null) {
      const ps = Math.round(+post.similarity);
      const d = ps - (+c.similarity);
      const dir = dltCls(d, 3, 3);
      if (dir === 'up') up++;
      else if (dir === 'down') down++;
      rows.push(`<div class="cmp-row">
        <span class="cmp-dim">岗位相似度</span>
        <span class="cmp-val">${esc(String(c.similarity))}%</span>
        <span class="cmp-dlt ${dir}">${dir === 'up' ? '↑' : dir === 'down' ? '↓' : '→'}${d === 0 ? '' : (d > 0 ? '+' : '') + d}pt</span>
        <span class="cmp-val strong">${ps}%</span>
        <span class="cmp-note" title="面试证据对「与岗位匹配度」的重新判断">${d === 0 ? '与简历阶段判断一致' : d > 0 ? '面试证据支持上调岗位匹配度' : '面试证据显示匹配度应下调'}</span>
      </div>`);
    }
    if (!rows.length) return '';

    const ver = Array.isArray(r.verified) ? r.verified : [];
    const full = ver.filter((v) => String(v.verdict || '').trim() === '证实').length;
    const part = ver.filter((v) => String(v.verdict || '').indexOf('部分') >= 0).length;
    const neg = ver.filter((v) => /推翻|存疑/.test(String(v.verdict || ''))).length;
    const nf = Array.isArray(r.newFindings) ? r.newFindings.length : 0;

    const recA = decOf(r.recommend);
    const changed = !!(r.recommend && c.recommend && r.recommend !== c.recommend);
    const recTxt = recA ? recA.label : (r.recommend || '—');
    const oldTxt = c.recommendWhy || c.tag || '—';

    return `<div class="cmp">
      <div class="cmp-h"><span>先后对比</span><span class="cmp-sub">简历阶段 → 面试复核后</span><span class="cmp-spacer"></span><span class="cmp-badge ${changed ? 'chg' : ''}">${changed ? '结论有变化' : '结论延续'}</span></div>
      <div class="cmp-verdict">
        <div class="cmp-v"><div class="cmp-k">简历阶段</div><div class="cmp-b">${esc(c.tag || '—')}</div></div>
        <div class="cmp-arrow">→</div>
        <div class="cmp-v"><div class="cmp-k">面试复核后</div><div class="cmp-b${changed ? ' chg' : ''}">${esc(recTxt)}</div></div>
      </div>
      <div class="cmp-reason">简历阶段理由：${esc(oldTxt)}${r.recommendWhy ? '<br>面试复核理由：' + esc(r.recommendWhy) : ''}</div>
      ${rows.join('')}
      <div class="cmp-stats">
        <span>证实 ${full} 项</span><span>部分证实 ${part} 项</span><span>推翻或存疑 ${neg} 项</span><span>面试新发现 ${nf} 条</span>
        <span class="cmp-sum">维度上调 ${up} · 下调 ${down}</span>
      </div>
    </div>`;
  }

  function renderAResult(a, c) {
    const r = a.result || {};
    const cons = r.consistency || {};
    const cls = cons.level === 'high' ? 'green' : cons.level === 'low' ? 'red' : 'amber';
    const rec = decOf(r.recommend);
    const ver = Array.isArray(r.verified) ? r.verified : [];
    const un = Array.isArray(r.unresolved) ? r.unresolved : [];
    const nf = Array.isArray(r.newFindings) ? r.newFindings : [];
    const dims = Array.isArray(r.dimensions) ? r.dimensions : [];
    const basis = a.basis || {};
    const basisTxt = [basis.transcript ? '逐字稿' : '', basis.minutes ? '会议纪要' : '', basis.audio ? '录音' : ''].filter(Boolean).join(' + ');

    return `<div class="ares">
      <div class="ares-h">
        <span class="tag ${cls}">言行一致性 · ${esc(cons.label || '—')}</span>

        <span class="tag gray">${esc(a.model || '')} · ${esc(fmtTs(a.at))}</span>
      </div>

      ${
        ver.length

            ver.map((v) => `<div class="vrow">

            </div>`).join('') + '</div>'
          : ''
      }
      ${
        dims.length
          ? '<div class="as-sec"><div class="as-t">面试表现评估</div>' +
            dims.map((d) => `<div class="drow2">
              <span class="dname2">${esc(d.name)}</span>
              <span class="dbar"><i style="width:${Math.max(0, Math.min(5, +d.score || 0)) * 20}%"></i></span>
              <span class="dnum">${esc(String(d.score))}</span>
              <span class="dnote">${esc(d.note)}</span>
            </div>`).join('') + '</div>'
          : ''
      }
      ${
        un.length
          ? '<div class="as-sec"><div class="as-t">仍未澄清的疑点</div><ul class="slist">' +
            un.map((t) => '<li>' + esc(t) + '</li>').join('') + '</ul></div>'
          : ''
      }
      ${
        nf.length
          ? '<div class="as-sec"><div class="as-t">面试新发现</div>' +
            nf.map((n) => `<div class="item"><div class="it"><span class="dot a"></span>${esc(n.t)}</div><div class="id" style="padding-left:14px">${esc(n.d)}</div></div>`).join('') + '</div>'
          : ''
      }
      ${r.summary ? '<div class="as-sec"><div class="as-t">面试后综合判断</div><div class="callout blue">' + esc(r.summary) + '</div></div>' : ''}
      ${r.recommendWhy ? '<div class="as-sec"><div class="as-t">结论建议</div><div class="callout ' + (rec ? (rec.cls === 'green' ? 'green' : rec.cls === 'red' ? 'amber' : 'amber') : 'blue') + '">' + esc(r.recommendWhy) + '</div></div>' : ''}
      <div class="ares-foot">复核依据：${esc(basisTxt || '—')}　·　原简历六维评分保持不变，面试后的修正分单列在上方对比卡中，便于追溯对比</div>
    </div>`;
  }

          <div class="mmeta">Word 会议纪要 · ${o.minutes.chars} 字${o.minutes.imageCount ? ' · ' + o.minutes.imageCount + ' 张图片' : ''} · 导入于 ${esc(fmtTsShort(o.minutes.addedAt))}</div>
          ${imgs.length ? '<div class="mimg">' + imgs.slice(0, 6).map((im) => '<img src="' + im.url + '" alt="' + esc(im.name) + '">').join('') + '</div>' : ''}
          ${!imgs.length && o.minutes.imageCount ? '<div class="mabs">纪要中的 ' + o.minutes.imageCount + ' 张图片未持久化保存，重新打开工具后重新导入该 Word 即可查看。</div>' : ''}
          <div class="mpreview"><pre>${esc(o.minutes.text.slice(0, MAT_PREVIEW))}${o.minutes.text.length > MAT_PREVIEW ? '\n\n……（仅预览前 ' + MAT_PREVIEW + ' 字）' : ''}</pre></div>
        </div>
        <button class="mdel" data-del="minutes" title="移除">移除</button>
      </div>`);
    }

    if (!o.audio && !o.transcript && !o.minutes) {
      rows.push(`<div class="matempty">还没有面试材料。建议顺序：先导入录音留档 → 用剪映 / 讯飞听见等工具把录音转成文字 → 把逐字稿导入 → 有会议纪要一并导入 → 点「开始 AI 复核」。<br><b>说明：</b>浏览器不能把音频转成文字，转写需要在外部工具完成；逐字稿支持 <b>.docx / .txt / .srt / .vtt</b>（转写工具导出 Word 也能直接上传）；会议纪要支持 .docx（含图片）。</div>`);
    }

    const canRun = !!(o.transcript || o.minutes);
    rows.push(`<div class="aibox">
      <div class="aihead">
        <span class="aititle">AI 面试复核</span>
        <span class="aistatus">${hasKey
          ? '<span class="okdot"></span>已配置 ' + esc(prov.name) + ' · ' + esc(cfg.model || prov.model)
          : '<span class="nodont"></span>未配置密钥'}</span>
        <button class="btn" id="btnAICfg">AI 设置</button>
      </div>
      <div class="aibtns">
        <button class="btn primary" id="btnAIRun"${canRun ? '' : ' disabled'}>${o.analysis ? '重新分析' : '开始 AI 复核'}</button>
        <button class="btn" id="btnAICopy">生成分析请求（复制到其他 AI）</button>
      </div>
      <div class="ainote" id="matNote">${canRun
        ? (hasKey
            ? '将把简历阶段的六维结论、简历疑点与本次面试材料一起送交 AI 复核；结果只保存在本机，原简历评估分数不变。'
            : '面试材料已就绪。请先点右上角「AI 设置」填入 API Key，再点「开始 AI 复核」。')
        : '请先导入逐字稿或会议纪要 —— 只有录音文件无法分析（浏览器不能读取音频内容）。'}</div>
      ${o.analysis ? renderAResult(o.analysis, c) : ''}
      ${aiCfgHTML(cfg)}
    </div>`);

    host.innerHTML = rows.join('');
    bindMatsUI(c);
  }

  function bindMatsUI(c) {
    const host = $('#matHost');
    if (!host) return;
    const pick = (accept, cb) => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = accept;
      inp.style.display = 'none';
      inp.addEventListener('change', (e) => {
        const f = e.target.files && e.target.files[0];
        if (f) cb(f);
      });
      document.body.appendChild(inp);
      inp.click();
      setTimeout(() => inp.remove(), 60000);
    };

    $$('[data-imp]', host).forEach((b) =>
      b.addEventListener('click', () => {
        const kind = b.dataset.imp;
        if (kind === 'audio') pick('audio/*,.m4a,.mp3,.wav,.aac,.amr', (f) => importAudio(c, f));
        else if (kind === 'transcript') pick('.docx,.txt,.srt,.vtt,.md,text/plain', (f) => importTranscript(c, f));
        else pick('.docx', (f) => importMinutes(c, f));
      })
    );

    $$('.mdel', host).forEach((b) =>
      b.addEventListener('click', () => {
        const kind = b.dataset.del;
        const label = kind === 'audio' ? '录音记录' : kind === 'transcript' ? '逐字稿' : '会议纪要';
        if (!window.confirm('确定移除该候选人的' + label + '吗？\n（已有的 AI 复核结果会一并清除，需重新分析）')) return;
        if (kind === 'audio') delete AUDIO_URLS[c.id];
        if (kind === 'minutes') delete MINUTES_IMG[c.id];
        delMat(c.id, kind);
        renderMats(c);
        renderList();
      })
    );

    const btnCfg = $('#btnAICfg');
    const cfgBox = $('#aiCfgBox');
    if (btnCfg && cfgBox) {
      btnCfg.addEventListener('click', () => {
        cfgBox.style.display = cfgBox.style.display === 'none' ? 'block' : 'none';
      });
    }

    const selProv = $('#aiProv');
    if (selProv) {
      selProv.addEventListener('change', () => {
        const cfg = loadAI();
        cfg.provider = selProv.value;
        cfg.model = aiProvider(cfg.provider).model;
        saveAI(cfg);
        renderMats(c);
        const box = $('#aiCfgBox');
        if (box) box.style.display = 'block';
      });
    }

    const btnSave = $('#aiSave');
    if (btnSave) {
      btnSave.addEventListener('click', () => {
        const p = $('#aiProv');
        const m = $('#aiModel');
        const k = $('#aiKey');
        const kv = normKey(k ? k.value : '');
        if (k) k.value = kv; // 回写清洗后的密钥，便于肉眼确认有没有带进多余字符
        if (!kv) { noteMat('请先粘贴密钥，再点「保存到本机」。', 'amber'); return; }
        saveAI({ provider: p ? p.value : 'zhipu', model: m ? m.value : '', apiKey: kv });
        renderMats(c);
        const box = $('#aiCfgBox');
        if (box) box.style.display = 'block';
        const shape = keyShapeWarn(kv);
        noteMat('AI 设置已保存到本机 ✓' + (shape ? '　但请注意：' + shape + '。' : ''), shape ? 'amber' : 'ok');
      });
    }

    const btnClearKey = $('#aiClear');
    if (btnClearKey) {
      btnClearKey.addEventListener('click', () => {
        const cfg = loadAI();
        cfg.apiKey = '';
        saveAI(cfg);
        renderMats(c);
        noteMat('已清除本机保存的密钥。', 'ok');
      });
    }

    // 测试连接：一键确认密钥 / 模型名 / 网络是否都通
    const btnTest = $('#aiTest');
    if (btnTest) {
      btnTest.addEventListener('click', () => {
        const p = $('#aiProv');
        const m = $('#aiModel');
        const k = $('#aiKey');
        const kv = normKey(k ? k.value : '');
        if (k) k.value = kv;
        const cfg = {
          provider: p ? p.value : 'zhipu',
          model: m ? m.value : '',
          apiKey: kv,
        };
        if (!cfg.apiKey) {
          noteMat('请先在「API Key」栏粘贴密钥，再点「测试连接」。', 'amber');
          return;
        }
        const shape0 = keyShapeWarn(kv);
        if (shape0) noteMat('先提醒一下：' + shape0 + '。确认无误后直接重试，或重新复制一次密钥。', 'amber');
        saveAI(cfg); // 顺手保存，避免测通了却没存上
        btnTest.disabled = true;
        btnTest.textContent = '测试中…';
        noteMat('正在连接 ' + aiProvider(cfg.provider).name + '（' + (cfg.model || aiProvider(cfg.provider).model) + '）…', 'ok');
        testAI(cfg)
          .then((r) => {
            const used = r.model || cfg.model || aiProvider(cfg.provider).model;
            const swapped = r.model && cfg.model && r.model !== cfg.model;
            if (swapped) {
              // 默认模型繁忙或不可用时自动改用可用的那一个，用户无需手动折腾
              saveAI({ provider: cfg.provider, model: r.model, apiKey: cfg.apiKey });
            }
            renderMats(c);
            const box = $('#aiCfgBox');
            if (box) box.style.display = 'block';
            noteMat(
              '连接成功 ✓ ' + aiProvider(cfg.provider).name + ' · ' + used +
              '，响应 ' + r.ms + ' 毫秒（模型回复「' + r.reply + '」）。' +
              (swapped ? '原模型 ' + cfg.model + ' 当时被限流，已自动改用 ' + r.model + '，后续复核会用它。' : '') +
              '接下来导入逐字稿或会议纪要，即可点「开始 AI 复核」。',
              'ok'
            );
          })
          .catch((e) => {
            btnTest.disabled = false;
            btnTest.textContent = '测试连接';
            const box = $('#aiCfgBox');
            if (box) box.style.display = 'block';
            noteMat('连接失败 ✗ ' + (e && e.message ? e.message : e) + '　（这行字可整段复制发我，我帮你定位原因）', 'amber');
          });
      });
    }

    const btnRun = $('#btnAIRun');
    if (btnRun) btnRun.addEventListener('click', () => runAIAnalysis(c));

    const btnCopyAI = $('#btnAICopy');
    if (btnCopyAI) btnCopyAI.addEventListener('click', () => copyAIRequest(c));
  }

  function bindMats(c) {
    renderMats(c);
  }

  /* ---------- 事件 ---------- */
  // 顶栏：导出 / 导入 —— 对应整个工具的数据（决策 + 流水 + 简历截图），任何页面都可用
  const topExport = $('#btnExport');
  if (topExport) topExport.addEventListener('click', doExport);
  const topImport = $('#btnImport');
  const topFile = $('#importFile');
  if (topImport && topFile) {
    topImport.addEventListener('click', () => topFile.click());
    topFile.addEventListener('change', (e) => {
      const f = e.target.files && e.target.files[0];
      doImport(f);
      topFile.value = '';
    });
  }
  $('#pClose').addEventListener('click', () => {
    closePanel();
    renderList();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closePanel();
      renderList();
    }
  });

  /* ---------- 对外钩子（自动化测试 / 将来接入其他数据源） ---------- */
  window.__aijd = {
    parseSubtitle, parseDocx, buildAIRequest, loadMats, setMat, delMat, renderMats, matOf, aiProvider,
    normKey, keyShapeWarn, testAI, matTag,
  };

  /* ---------- 启动 ---------- */
  renderRail();
  renderList();
})();

</script>
</body>
</html>
